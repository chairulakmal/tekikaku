# Local development database; production is Neon (SPEC: architecture).
# The postgres:18 image mounts /var/lib/postgresql (not .../data as in 17 and earlier).
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tekikaku
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tekikaku"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
